name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Make app icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1b1446' --splashBackgroundColor '#1b1446'
        continue-on-error: true

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Allow access to the phone's speech engine
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q TTS_SERVICE "$M" || sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n</manifest>#' "$M"
          cat "$M"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WordPop.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: WordPop-apk
          path: WordPop.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Word Pop (latest build)
          body: Download WordPop.apk below and open it on your Android phone to install.
          files: WordPop.apk
          make_latest: true
